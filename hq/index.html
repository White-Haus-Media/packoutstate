<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homecoming HQ · Pack Out State</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
/* Internal page. Plain and readable on purpose: body font throughout, no
   display face, white background. This is a working tool, not a showpiece. */
body{background:#fff;color:#16161a;font-family:var(--sans)}
.shell{max-width:1100px;margin-inline:auto;padding:clamp(24px,4vw,48px) var(--pad)}

.gate{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #E2DCD1;padding:30px;border-radius:6px}
.gate h1{font-family:var(--sans);font-weight:800;font-size:1.4rem;line-height:1.2;margin-bottom:18px;letter-spacing:-.01em}
label span{display:block;font-size:.8rem;font-weight:700;color:#55555c;margin-bottom:7px}
input{width:100%;font-family:var(--sans);font-size:1rem;padding:12px 14px;border:1px solid #CFC9BE;
      border-radius:4px;background:#fff;color:#16161a}
input:focus{outline:3px solid var(--red);outline-offset:1px;border-color:var(--red)}
.err{color:#A8071A;font-size:.92rem;margin-top:12px;display:none}
.err.on{display:block}

h1.page{font-family:var(--sans);font-weight:800;font-size:1.75rem;letter-spacing:-.015em;margin-bottom:4px}
.sub{color:#55555c;font-size:.98rem;margin-bottom:26px}
h2{font-family:var(--sans);font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:34px 0 12px}

.tally{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.tally div{flex:1 1 150px;border:1px solid #E6E1D8;border-radius:6px;padding:14px 16px;
           font-size:.8rem;font-weight:700;color:#55555c}
.tally b{display:block;font-family:var(--sans);font-weight:800;font-size:1.8rem;color:#16161a;
         letter-spacing:-.02em;margin-top:2px}

.wrapx{overflow-x:auto;border:1px solid #E6E1D8;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:620px}
th{text-align:left;font-size:.78rem;font-weight:700;color:#55555c;background:#FAF8F4;
   padding:11px 14px;border-bottom:1px solid #E6E1D8;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #F0ECE4;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tr.open td{color:#8A8680}
td a{color:#16161a}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;
      background:#F3EFE8;color:#44444a;border-radius:20px}
.note{color:#55555c;font-size:.9rem;margin-top:10px}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>Homecoming HQ</h1>
  <form id="gateForm">
    <label><span>Password</span><input type="password" id="pw" autocomplete="current-password" autofocus></label>
    <div class="err" id="err"></div>
    <button class="btn btn--primary" type="submit" style="width:100%;margin-top:16px">Open</button>
  </form>
</div>

<main class="shell" id="app" hidden>
  <h1 class="page">Clocked Out signups</h1>
  <p class="sub">Live list of reservations and shooters for Friday, October 30 at District.</p>

  <div class="tally" id="tally"></div>

  <h2>The schedule</h2>
  <div class="wrapx">
    <table>
      <thead><tr><th>Time</th><th>Name</th><th>People</th><th>Contact</th><th>Note</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2>Photographers and videographers</h2>
  <div class="wrapx">
    <table>
      <thead><tr><th>Name</th><th>Role</th><th>Contact</th><th>Link</th></tr></thead>
      <tbody id="crew"></tbody>
    </table>
  </div>
  <p class="note" id="crewNote"></p>
</main>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };
  var fmt = function(iso){ return new Date(iso).toLocaleString('en-US',
    {timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'}); };

  $('#gateForm').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('#err'); err.className = 'err';
    fetch('/api/hq', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: $('#pw').value})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(!res.ok){ err.textContent = res.d.error || 'Wrong password'; err.className = 'err on'; return; }
        render(res.d);
      })
      .catch(function(){ err.textContent = 'Could not reach the server'; err.className = 'err on'; });
  });

  function render(d){
    $('#gate').hidden = true; $('#app').hidden = false;
    var t = d.totals || {};
    $('#tally').innerHTML =
      '<div>Booked<b>' + (t.booked||0) + ' / ' + (t.slots||0) + '</b></div>' +
      '<div>People coming<b>' + (t.guests||0) + '</b></div>' +
      '<div>Shooters<b>' + (d.creators||[]).length + '</b></div>';

    $('#rows').innerHTML = (d.schedule||[]).map(function(r){
      if(!r.name) return '<tr class="open"><td>' + fmt(r.starts_at) +
        '</td><td colspan="4">Open</td></tr>';
      return '<tr><td>' + fmt(r.starts_at) + '</td><td>' + esc(r.name) +
        '</td><td>' + r.party_size + '</td><td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) +
        '</a><br><a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a></td><td>' +
        (r.notes ? esc(r.notes) : '') + '</td></tr>';
    }).join('');

    $('#crew').innerHTML = (d.creators||[]).map(function(c){
      return '<tr><td>' + esc(c.name) + '</td><td><span class="pill">' +
        (c.role === 'photo' ? 'Photo' : 'Video') + '</span></td><td><a href="mailto:' + esc(c.email) +
        '">' + esc(c.email) + '</a><br><a href="tel:' + esc(c.phone) + '">' + esc(c.phone) +
        '</a></td><td>' + (c.link ? esc(c.link) : '') + '</td></tr>';
    }).join('') || '<tr class="open"><td colspan="4">Nobody signed up yet</td></tr>';

    var photo = (d.creators||[]).filter(function(c){ return c.role === 'photo'; }).length;
    var video = (d.creators||[]).length - photo;
    $('#crewNote').textContent = 'Photo ' + photo + ' of 3, video ' + video + ' of 3.';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
})();
</script>
</body>
</html>
